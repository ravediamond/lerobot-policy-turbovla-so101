[build-system]
requires = ["setuptools>=71.0.0,<82.0.0"]
build-backend = "setuptools.build_meta"

[project]
# LeRobot discovers third-party policies by walking installed distributions and importing every 
# one whose name starts with it (see `lerobot.utils.import_utils.register_third_party_plugins`).
name = "lerobot_policy_turbovla_so101"
version = "0.3.0"
description = "TurboVLA (upstream code, parity-tested) as a LeRobot policy, run on a real SO-101 arm: --policy.type=turbovla_so101"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
keywords = ["robotics", "lerobot", "vla", "imitation-learning", "turbovla", "so101"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Let pip resolve torch requirements
dependencies = [
    "lerobot>=0.6.0",
    "transformers>=5.4.0,<5.6.0",
]

[project.optional-dependencies]
test = ["pytest>=8.1.0,<10.0.0", "tokenizers>=0.21"]
plots = ["matplotlib>=3.8.0"]

[project.urls]
Homepage = "https://github.com/ravediamond/lerobot-policy-turbovla-so101"
Repository = "https://github.com/ravediamond/lerobot-policy-turbovla-so101"
Issues = "https://github.com/ravediamond/lerobot-policy-turbovla-so101/issues"
"Upstream research code" = "https://github.com/H-EmbodVis/TurboVLA"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"lerobot_policy_turbovla_so101.upstream" = ["LICENSE.upstream"]

[tool.ruff]
line-length = 110
target-version = "py312"
# Vendored upstream code stays byte-for-byte diffable against H-EmbodVis/TurboVLA: not reformatted.
extend-exclude = ["src/lerobot_policy_turbovla_so101/upstream"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
